# Packaging of the xreg Python bindings (see python/README.md).
#
# The Python extension module statically links the xreg library, which is built
# as part of the wheel. The xreg third-party dependencies (ITK, VTK, OpenCV,
# Boost) must already be built and passed to CMake, e.g.:
#
#   CMAKE_ARGS="-DITK_DIR=... -DVTK_DIR=... -DOpenCV_DIR=... -DBoost_INCLUDE_DIR=..." pip install .
#
# The extension targets the Python stable ABI (abi3), so a single wheel per
# platform supports Python 3.12 and all newer versions.

[build-system]
# numpy is only needed at build time for type stub generation
requires = ["scikit-build-core>=0.10", "nanobind>=3.1", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "xreg"
dynamic = ["version"]
description = "Python bindings for xReg: 2D/3D registration of 3D volumes to 2D X-ray images"
readme = "python/README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Robert Grupp" }]
dependencies = ["numpy"]

[project.optional-dependencies]
sitk = ["SimpleITK"]
itk = ["itk"]
test = ["pytest", "SimpleITK"]

[project.urls]
Homepage = "https://github.com/rg2/xreg"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
cmake.build-type = "Release"
# persistent build directory to allow for incremental rebuilds
build-dir = "build-py/{wheel_tag}"
wheel.packages = ["python/xreg"]
# target the stable ABI of Python 3.12 (abi3)
wheel.py-api = "cp312"
# only install the Python extension module (not the C++ library, headers, etc.)
install.components = ["xreg_python"]
sdist.exclude = ["build*", "tests/tmp", "dist", "docker", ".venv*", ".vscode", "*.mp4", "*.bak"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(xreg VERSION (?P<value>[0-9.]+)\)'

[tool.scikit-build.cmake.define]
XREG_BUILD_PYTHON = "ON"
XREG_BUILD_APPS = "OFF"
XREG_BUILD_TESTS = "OFF"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
